name: Build Windows Driver Only

on:
  push:
    branches: [ idle-fix ]
  workflow_dispatch:

jobs:
  build_driver:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Prepare dependencies
        shell: pwsh
        run: |
          cargo xtask prepare-deps --platform windows

      - name: Build driver_alvr_server.dll
        shell: pwsh
        env:
          RUST_BACKTRACE: 1
        run: |
          cargo build -p alvr_server_openvr --release --features gpl
          Copy-Item target/release/alvr_server_openvr.dll driver_alvr_server.dll

      - name: Upload driver_alvr_server.dll
        uses: actions/upload-artifact@v4
        with:
          name: driver_alvr_server
          path: ./driver_alvr_server.dll
